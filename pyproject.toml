[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stegdetect"
version = "0.1.0"
description = "Pre-filter that catches steganographic prompt-injection carriers before they reach an LLM"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PaulinoTech1" }]
keywords = ["prompt-injection", "steganography", "unicode", "llm-security", "prompt-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
urls = { Homepage = "https://github.com/PaulinoTech1/Steganography" }

[project.optional-dependencies]
dev = ["pytest", "hypothesis>=6", "jsonschema>=4", "wheel"]

[project.scripts]
stegdetect = "stegdetect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
