[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stegdetect"
version = "0.1.0"
description = "Pre-filter that catches steganographic prompt-injection carriers before they reach an LLM"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
stegdetect = "stegdetect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
